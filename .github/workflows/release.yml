name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build all targets
        run: npm run build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Description |
            |---|---|
            | `sn_schema_explorer.html` | Schema Map · Inspector · Path Finder · Schema Diff · Export · Settings · Guide · Setup Instructions |

            Open the `.html` file directly in your browser — no installation or server needed.

            ---
          files: |
            dist/sn_schema_explorer.html
