name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Gate the release on the same checks CI runs, so a broken tag can't ship.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build all targets
        run: npm run build

      - name: E2E tests
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e

      # Release notes are curated per version in docs/release-notes/<tag>.md
      # (the file is the full release body — features + Downloads table). Fail
      # loudly if the tag has no notes file, so a release can't ship empty.
      - name: Verify release notes exist
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes file: $NOTES"
            echo "Create it before tagging (see docs/release-notes/ for the format)."
            exit 1
          fi
          echo "Using release notes from $NOTES"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/sn_schema_explorer.html
            dist/exporter/sn-schema-export.bg.js
            dist/exporter/sn-schema-export.node.standalone.js
