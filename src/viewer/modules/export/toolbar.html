    <!-- Export menu — disabled until data is loaded -->
    <div class="export-wrap desk-only">
      <button class="btn btn-nav-disabled" id="btn-export" title="Export data or current view" disabled>Export ▾</button>
      <div class="export-menu" id="export-menu" role="menu" aria-hidden="true">
        <button class="export-item" data-export="schema-json" role="menuitem">
          <span class="export-item-label">Schema as JSON</span>
          <span class="export-item-desc">The full loaded dataset — share with colleagues</span>
        </button>
        <button class="export-item" data-export="neighbourhood-json" role="menuitem">
          <span class="export-item-label">Neighbourhood as JSON</span>
          <span class="export-item-desc">Just the selected table and its visible neighbours</span>
        </button>
        <div class="export-sep"></div>
        <button class="export-item" data-export="view-png" role="menuitem">
          <span class="export-item-label">Current view as PNG</span>
          <span class="export-item-desc">Raster screenshot of what's on screen now</span>
        </button>
        <button class="export-item" data-export="view-svg" role="menuitem">
          <span class="export-item-label">Current view as SVG</span>
          <span class="export-item-desc">Vector of what's on screen — scales cleanly</span>
        </button>
        <div class="export-sep"></div>
        <button class="export-item" data-export="full-png" role="menuitem">
          <span class="export-item-label">Full canvas as PNG</span>
          <span class="export-item-desc">The entire diagram, not just what's visible</span>
        </button>
        <button class="export-item" data-export="full-svg" role="menuitem">
          <span class="export-item-label">Full canvas as SVG</span>
          <span class="export-item-desc">Vector of every node — editable in Illustrator/Inkscape</span>
        </button>
        <div class="export-sep"></div>
        <div class="export-scale-row" title="PNG output scale. Higher = sharper text on slides, larger file.">
          <span class="export-scale-label">PNG resolution</span>
          <div class="export-scale-slider-wrap">
            <input type="range" id="export-scale-slider" class="export-scale-slider"
                   min="1" max="50" step="1" value="2" title="PNG export scale">
            <span id="export-scale-val" class="export-scale-val">2×</span>
          </div>
        </div>
        <div class="export-scale-info-row">
          <span id="export-scale-info" class="export-scale-info"></span>
        </div>
        <div class="export-bg-section">
          <div class="export-bg-row" title="Background fill for PNG and SVG exports">
            <span class="export-scale-label">Background</span>
            <div class="export-bg-controls">
              <button id="export-bg-swatch-btn" class="export-bg-swatch"
                      title="Pick export background color" aria-expanded="false"></button>
              <input type="text" id="export-bg-hex" class="export-bg-hex"
                     placeholder="#rrggbb" maxlength="7" spellcheck="false"
                     title="Hex color value — type #rrggbb or paste any 3/6-digit hex">
            </div>
          </div>
          <!-- Custom HSV color picker panel — shown when swatch button is clicked -->
          <div id="export-color-picker" class="export-color-picker" hidden>
            <canvas id="export-cp-sv" class="export-cp-sv" width="240" height="130"></canvas>
            <input type="range" id="export-cp-hue" class="export-cp-hue"
                   min="0" max="359" value="0" title="Hue">
            <div class="export-cp-alpha-wrap">
              <input type="range" id="export-cp-alpha" class="export-cp-alpha"
                     min="0" max="100" step="1" value="100" title="Opacity">
            </div>
          </div>
        </div>
      </div>
    </div>
