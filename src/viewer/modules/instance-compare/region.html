<!-- Instance Comparison workspace region (populated by modules/instance-compare). -->
<div id="instance-compare" class="workspace-region ic-workspace">
  <div class="ic-inner">
    <div class="ic-head">
      <div class="ic-eyebrow">Cross-instance comparison</div>
      <div class="ic-title">Instance Comparison</div>
      <div class="ic-sub">Reconcile plugins, store apps, custom apps &amp; system properties across your registered instances.</div>
    </div>

    <!-- Section tab bar (rendered by index.js; tabs disable when &lt;2 instances carry the section) -->
    <div class="ic-tabs" id="ic-tabs"></div>

    <div class="ic-controls">
      <input type="text" id="ic-search" placeholder="Search name or key…" autocomplete="off" spellcheck="false">
      <select id="ic-filter" title="Filter rows by status">
        <option value="all">All rows</option>
        <option value="diff">Differences only</option>
        <option value="missing">Missing somewhere</option>
        <option value="drift">Version drift</option>
        <option value="active">State mismatch</option>
        <option value="inactive">Inactive everywhere</option>
      </select>
      <label class="ic-toggle"><input type="checkbox" id="ic-showdates"> Show dates</label>
      <button class="btn" id="ic-export">Export CSV</button>
    </div>

    <!-- Stat tiles (rendered by index.js) -->
    <div class="ic-stats" id="ic-stats"></div>

    <div class="ic-table-wrap glass" id="ic-table-wrap">
      <table class="ic-table" id="ic-table"><thead></thead><tbody></tbody></table>
    </div>
    <div class="ic-empty" id="ic-empty" style="display:none"></div>
  </div>
</div>
