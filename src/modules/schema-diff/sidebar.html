  <!-- DIFF SIDEBAR — shown when viewMode === 'diff' -->
  <div id="diff-sidebar">
    <!-- Base / Compare pickers — populated from the registered instances -->
    <div class="diff-picker" id="diff-instance-picker">
      <div class="diff-picker-row">
        <span class="diff-picker-label">Base</span>
        <div class="diff-picker-control" id="diff-base-mount"></div>
      </div>
      <div class="diff-picker-swap-row">
        <button class="diff-swap-btn" id="diff-swap-btn" title="Swap base and compare" aria-label="Swap base and compare" disabled>⇄</button>
      </div>
      <div class="diff-picker-row">
        <span class="diff-picker-label">Compare</span>
        <div class="diff-picker-control" id="diff-compare-mount"></div>
      </div>
      <div class="diff-picker-empty" id="diff-picker-empty" style="display:none">Register a second instance on the Home page to compare.</div>
    </div>
    <!-- Export method mismatch warning — shown when base and compare schemas use different export_mode -->
    <div class="diff-mode-warn" id="diff-mode-warn" style="display:none"></div>
    <!-- Summary counts — visible once a diff is loaded -->
    <div class="diff-summary" id="diff-summary">
      <div class="diff-stat ds-added"   id="diff-stat-added"   title="Filter to added tables">
        <span class="diff-stat-n" id="diff-n-added">0</span>
        <span class="diff-stat-label">Added</span>
      </div>
      <div class="diff-stat ds-removed" id="diff-stat-removed" title="Filter to removed tables">
        <span class="diff-stat-n" id="diff-n-removed">0</span>
        <span class="diff-stat-label">Removed</span>
      </div>
      <div class="diff-stat ds-changed" id="diff-stat-changed" title="Filter to changed tables">
        <span class="diff-stat-n" id="diff-n-changed">0</span>
        <span class="diff-stat-label">Changed</span>
      </div>
    </div>
    <!-- Search / filter input — visible once a diff is loaded -->
    <div class="diff-search-wrap" id="diff-search-wrap" style="display:none">
      <input type="text" id="diff-search-input" class="diff-search-input"
             placeholder="Filter tables…" autocomplete="off" spellcheck="false">
      <button class="diff-search-clear" id="diff-search-clear" title="Clear filter" style="display:none" aria-label="Clear filter">✕</button>
    </div>
    <div class="diff-toggle-row" id="diff-toggle-row">
      <span>Showing changed tables only</span>
      <button class="diff-show-all-btn" id="diff-show-all-btn">Show all</button>
    </div>
    <!-- Flat grouped list of changed tables -->
    <div class="diff-list" id="diff-list"></div>
  </div>
